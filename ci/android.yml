# Construye la app de Android (APK) y la publica en «Releases» del repositorio.
# La app abre la web publicada (así las pantallas se actualizan solas) y agrega avisos nativos.
# Corre cuando cambia algo en app-android/ o a mano (Actions → App Android → Run workflow).
# Necesita los secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASS (llave para firmar la app).

name: App Android

on:
  push:
    branches: [main]
    paths: ['app-android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la llave de firma
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$B64" ] || [ -z "$PASS" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASS (ver .publicar/android-llave.txt)"; exit 1
          fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/miagenda.jks"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        working-directory: app-android
        run: npm ci --no-audit --no-fund

      - name: Preparar el proyecto Android
        working-directory: app-android
        run: npx cap sync android

      - name: Construir el APK
        working-directory: app-android/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/miagenda.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.${{ github.run_number }}

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/android/app/build/outputs/apk/release/app-release.apk mi-agenda.apk
          gh release create "apk-${{ github.run_number }}" mi-agenda.apk \
            --title "App Android 1.${{ github.run_number }}" \
            --notes "Instálala encima de la anterior: no se borra nada. Descarga: mi-agenda.apk" --latest
