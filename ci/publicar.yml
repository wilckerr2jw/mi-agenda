# Publica la app en Firebase cada vez que llega un cambio a la rama main.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (el JSON de la cuenta de servicio) en
# GitHub → Settings → Secrets and variables → Actions.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Revisa que el número de versión (X.Y.Z) sea el mismo en version.json, model.js, sw.js y la guía
      - name: Revisar la versión
        run: node herramientas/version.mjs

      # Pruebas de las funciones puras (fechas, .ics, horas, metas, importación); si fallan, no se publica
      - name: Pruebas
        run: node --test "tests/*.test.mjs"

      - name: Iniciar sesión en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar en Firebase
        run: |
          set -o pipefail
          npx --yes firebase-tools@15 deploy --only hosting,firestore --project mi-agenda-app-855f1 --non-interactive 2>&1 | tee deploy.log

      # Si falla, guarda el registro como artefacto de la ejecución (Actions → la ejecución → Artifacts), 7 días
      - name: Guardar el registro del error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-publicar-${{ github.run_number }}
          path: deploy.log
          if-no-files-found: ignore
          retention-days: 7
