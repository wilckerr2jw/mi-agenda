# Avisos de Mi Agenda: se ejecuta cada 5 minutos (gratis en repositorios públicos) y manda los avisos del día, de eventos compartidos,
# de versión nueva y de prueba. Usa el mismo secreto FIREBASE_SERVICE_ACCOUNT que «Publicar».
# GitHub puede atrasar unos minutos las tareas programadas; es normal.

name: Avisos

# Cada 5 minutos solo si existe la variable CADA5 = si (actívala cuando el repositorio sea público:
# en privado GitHub regala 2000 minutos al mes y cada 5 minutos gastaría más). Si no, corre una vez por hora.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    if: github.event_name != 'schedule' || github.event.schedule == '7 * * * *' || vars.CADA5 == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: avisos

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: avisos

      - name: Iniciar sesión en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Enviar avisos
        run: node avisos/run.js
