# Publica la app en Firebase cada vez que llega un cambio a la rama main.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (el JSON de la cuenta de servicio) en
# GitHub → Settings → Secrets and variables → Actions.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Iniciar sesión en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar en Firebase
        run: |
          set -o pipefail
          npx --yes firebase-tools@15 deploy --only hosting,firestore --project mi-agenda-app-855f1 --non-interactive 2>&1 | tee deploy.log

      # Si falla, deja el registro en la rama «diag» para poder revisarlo sin iniciar sesión
      - name: Guardar el registro del error
        if: failure()
        run: |
          [ -f deploy.log ] || exit 0
          mkdir -p /tmp/diag && cp deploy.log /tmp/diag/deploy.log
          cd /tmp/diag && git init -q && git checkout -q -b diag
          git add deploy.log
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -q -m "registro de ${{ github.workflow }} #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
